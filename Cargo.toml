[package]
name = "hokann"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A shell-aware terminal completion overlay"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/hokann"
keywords = ["completion", "pty", "shell", "terminal", "tui"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/.agents/**",
    "/assets/**",
    "/docs/**",
    "/src/**",
    "/tests/**",
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
]

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.5", features = ["derive"] }
crossbeam-channel = "0.5.15"
crc32fast = "1.5.0"
crossterm = "0.29.0"
fs2 = "0.4.3"
getrandom = "0.3.3"
nix = { version = "0.30.1", features = ["fs", "process", "signal", "user"] }
# portable-pty exposes its Unix master descriptor as a RawFd. This compatibility
# dependency provides a safe RawFd fcntl/poll API while this crate forbids unsafe.
nix-compat = { package = "nix", version = "0.26.4", features = ["fs", "poll"] }
portable-pty = "0.9.0"
ratatui = "0.30.2"
regex = "1.11.1"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
signal-hook = "0.3.18"
tempfile = "3.20.0"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
toml = "0.9.5"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"
vte = "0.15.0"
vt100 = "0.16.2"
wait-timeout = "0.2.1"
zeroize = { version = "1.8.1", features = ["serde"] }

[dev-dependencies]
avt = "0.18.0"
proptest = "1.10.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
