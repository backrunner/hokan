name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

run-name: Release ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            builder: cargo
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            builder: cross
          - target: x86_64-apple-darwin
            runner: macos-14
            builder: cargo
          - target: aarch64-apple-darwin
            runner: macos-14
            builder: cargo
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: taiki-e/install-action@cross
        if: matrix.builder == 'cross'
      - name: Verify tag and package version
        shell: bash
        run: |
          package_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag_version=${RELEASE_TAG#v}
          test "$package_version" = "$tag_version"
      - name: Build with Cargo
        if: matrix.builder == 'cargo'
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Build with cross
        if: matrix.builder == 'cross'
        run: cross build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: scripts/package-release.sh "${{ matrix.target }}" "${RELEASE_TAG#v}"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          file: target/${{ matrix.target }}/release/hokan
          format: spdx-json
          output-file: dist/hokan-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: hokan-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add release installer
        run: install -m 0755 scripts/install.sh dist/hokan-installer.sh
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.spdx.json hokan-installer.sh > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          # Beta channels ship as pre-releases (tags like v0.2.0-beta.1).
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: dist/*
